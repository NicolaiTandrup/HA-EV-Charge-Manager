    charger:
      required: true
      selector:
        text: null
    session_id:
      required: true
      selector:
        text: null
simulate_probe:
  fields:
    charger:
      required: true
      selector:
        text: null
    candidates:
      required: true
      selector:
        object: null
    samples:
      required: true
      selector:
        object: null
    commissioned_vehicles:
      required: true
      selector:
        object: null
    commissioned_chargers:
      required: true
      selector:
        object: null
