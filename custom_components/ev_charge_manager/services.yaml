    charger:
      required: true
      selector:
        text: {}
    session_id:
      required: true
      selector:
        text: {}
    key:
      required: true
      selector:
        text: {}
    owner:
      required: true
      selector:
        text: {}
    action:
      required: true
      selector:
        text: {}
    value:
      required: false
      selector:
        number:
          min: 0
          max: 100
          mode: box

